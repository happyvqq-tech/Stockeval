# A 股掃描：在 GitHub 的主機上抓 AkShare 行情做分析。
# 用途：開發環境的網路政策擋住 eastmoney 時，借 Actions 主機取得資料
# （使用者已同意）。只讀公開行情，不碰任何帳戶。
name: cn-scan

on:
  push:
    branches: [claude/upbeat-ramanujan-mh0k7j]
    paths: [.github/workflows/cn-scan.yml, data/cn.py]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyyaml requests akshare lxml html5lib
      - name: 技術面掃描：股票池＋擴充名單
        run: |
          # 東方財富在海外主機上會卡住（沒有逾時），這裡直接跳過它的兩個呼叫。
          # 名單都是大型股、沒有 ST，略過 ST 檢查不影響結果。
          cat > /tmp/run_cli.py <<'PY'
          import os, sys; sys.path.insert(0, os.getcwd())
          import data.cn as cn
          cn.ChinaAdapter._is_st = lambda self, code: False
          def _no_em(*a, **k): raise ConnectionError("跳過東方財富")
          cn.ChinaAdapter._fetch_em = staticmethod(_no_em)
          import cli
          sys.exit(cli.main(sys.argv[1:]))
          PY
          timeout 900 python /tmp/run_cli.py rec --market CN -v || true
          EXTRA=600025,600674,600886,601225,600028,601006,600377,600012,600548,601939,002142,000895,603288,600660,600066,600741,600104,600585,002372,600309,600436,000538
          EXTRA=$EXTRA,300308,300502,688981,002475,000725,600584,300059,601138,300760,600031,000338,601127,002230
          EXTRA=$EXTRA,000807,000933,601600,600111,603993,600547,601919,600050,600941,601728,600150
          timeout 1200 python /tmp/run_cli.py rec --market CN --symbols $EXTRA -v || true
