# 規則門檻 —— 全部數值集中在這裡。
# severity：2 = 止損級、1 = 減碼級。加總後由 actions 決定動作。

p6:                          # 黑K跌破 20MA
  severity: 2
  drop_pct: -2.0             # 當日跌幅需小於此值
  vol_ratio_min: 1.3         # 僅在 p6_require_volume 為 true 的市場生效
  ma20_slope_min: -0.30      # 20MA 斜率高於此值視為盤整，不算破位

p7:                          # 爆量下跌
  severity: 1
  vol_ratio: 2.0
  chg_pct_max: -1.0

p8:                          # 連續收在 20MA 之下
  severity: 2
  days_below: 3

p10:                         # 移動止盈（有獲利才啟動）
  severity: 1
  min_unrealized_pct: 15.0
  ma: 10                     # 跌破哪一條均線觸發，5 或 10

p11:                         # 向下跳空
  severity: 1
  gap_pct: -3.0

p13:                         # 乖離率過大（過熱，減碼不是停損）
  severity: 1
  bias_pct: 15.0

v6_2:                        # 資金曲線：自 60 日高點回撤
  severity: 2
  drawdown_pct: -20.0

v6_2a:                       # 高波動成長股放寬回撤門檻
  severity: 2
  ann_vol_min: 0.45
  drawdown_pct: -28.0

actions:                     # 觸發嚴重度加總 → 建議動作
  - {min_score: 4, action: EXIT_ALL,  label: 全數停損}
  - {min_score: 2, action: REDUCE_50, label: 降至 50%}
  - {min_score: 1, action: REDUCE_25, label: 降至 75%}
  - {min_score: 0, action: HOLD,      label: 續抱}

# 推薦（進場）評分權重，總和 100
score:
  trend: 30                  # 均線多頭排列
  momentum: 25               # 站上 20MA、斜率向上
  volume: 15                 # 量能配合
  position: 20               # 位階不過熱、回撤可控
  volatility: 10             # 波動率適中

  unknown: 0.5               # 該因子資料不足時給的比例分

  # 復盤時判斷一個因子的 IC 可不可信。
  # 背景：一個因子如果對大多數標的給出一樣的分數（例如波動率對絕大多數
  # 大型股都給滿分），它的相關係數會被少數幾檔離群值整個帶走 —— 數字可能
  # 很大，但完全不穩。這兩個門檻用來標記這種情況。
  ic_diagnostics:
    # 橫斷面標準差 ÷ 該因子權重。低於此值代表這個因子幾乎沒有鑑別度。
    # 用比值而不是絕對值，才能跨不同權重的因子比較。
    min_std_ratio: 0.12
    # 最多標的共用的那一個分數，佔全體的比例。超過此值代表分數高度集中。
    max_concentration_pct: 60.0

  # 單趟成本（bps）超過此值時扣分，最多扣 penalty_max 分
  cost_penalty_bps: 30
  cost_penalty_per_bps: 10   # 每超出 10bps 扣 1 分
  cost_penalty_max: 5.0

  thresholds:
    momentum:
      above_ma20_credit: 0.5   # 站上 20MA 先拿一半
      slope_full_pct: 2.0      # 20MA 5 日斜率達 2% 即拿滿另一半
    volume:
      up_vol_floor: 0.8        # 上漲量比低於此值不給分
      up_vol_full: 2.0         # 上漲量比達此值滿分
      dump_vol_ratio: 2.0      # 下跌爆量，量能分歸零
      dry_vol_ratio: 1.2       # 縮量下跌的量比上限
      dry_credit: 0.6          # 縮量下跌最多只能拿六成
    position:
      bias_ideal_lo: 0.0       # 乖離落在 0~8% 最理想
      bias_ideal_hi: 8.0
      bias_tolerance: 14.0     # 偏離理想帶多少才扣到零
      drawdown_zero_pct: -25.0 # 回撤到此值位階分歸零
    volatility:
      # 連續評分：以 ideal 為峰值、用對數距離的鐘形曲線。
      # 舊版「0.15~0.45 一律滿分」讓大型股幾乎全部同分，這個因子等於
      # 沒有鑑別度，復盤的 IC 會被少數幾檔高波動股帶走（見
      # docs/CALIBRATION.md）。
      ideal: 0.26              # 0.15 與 0.45 的幾何中點
      # 越小衰減越快。0.8 時：0.15 與 0.45 各得 0.62、0.20~0.35 得
      # 0.87~0.90、牛皮的 0.05 得 0.01、極端的 1.00 得 0.06。
      log_width: 0.8

  entry:
    stop_max_loss_pct: 8.0     # 停損取 20MA 與 -8% 兩者較低
    reward_risk: 2.0           # 目標價的報酬風險比
    risk_warn_pct: 10.0        # 停損距離超過此值就示警

  ratings:
    - {min: 75, rating: STRONG_BUY, label: 強烈推薦}
    - {min: 60, rating: BUY,        label: 推薦}
    - {min: 45, rating: NEUTRAL,    label: 中性觀望}
    - {min: 30, rating: REDUCE,     label: 偏空減碼}
    - {min: 0,  rating: AVOID,      label: 迴避}
