# 規則門檻 —— 全部數值集中在這裡。
# severity：2 = 止損級、1 = 減碼級。加總後由 actions 決定動作。

p6:                          # 黑K跌破 20MA
  severity: 2
  drop_pct: -2.0             # 當日跌幅需小於此值
  vol_ratio_min: 1.3         # 僅在 p6_require_volume 為 true 的市場生效
  ma20_slope_min: -0.30      # 20MA 斜率高於此值視為盤整，不算破位

p7:                          # 爆量下跌
  severity: 1
  vol_ratio: 2.0
  chg_pct_max: -1.0

p8:                          # 連續收在 20MA 之下
  severity: 2
  days_below: 3

p10:                         # 移動止盈（有獲利才啟動）
  severity: 1
  min_unrealized_pct: 15.0
  ma: 10                     # 跌破哪一條均線觸發，5 或 10

p11:                         # 向下跳空
  severity: 1
  gap_pct: -3.0

p13:                         # 乖離率過大（過熱，減碼不是停損）
  severity: 1
  bias_pct: 15.0

v6_2:                        # 資金曲線：自 60 日高點回撤
  severity: 2
  drawdown_pct: -20.0

v6_2a:                       # 高波動成長股放寬回撤門檻
  severity: 2
  ann_vol_min: 0.45
  drawdown_pct: -28.0

actions:                     # 觸發嚴重度加總 → 建議動作
  - {min_score: 4, action: EXIT_ALL,  label: 全數停損}
  - {min_score: 2, action: REDUCE_50, label: 降至 50%}
  - {min_score: 1, action: REDUCE_25, label: 降至 75%}
  - {min_score: 0, action: HOLD,      label: 續抱}

# 推薦（進場）評分權重，總和 100
score:
  trend: 30                  # 均線多頭排列
  momentum: 25               # 站上 20MA、斜率向上
  volume: 15                 # 量能配合
  position: 20               # 位階不過熱、回撤可控
  volatility: 10             # 波動率適中
  ratings:
    - {min: 75, rating: STRONG_BUY, label: 強烈推薦}
    - {min: 60, rating: BUY,        label: 推薦}
    - {min: 45, rating: NEUTRAL,    label: 中性觀望}
    - {min: 30, rating: REDUCE,     label: 偏空減碼}
    - {min: 0,  rating: AVOID,      label: 迴避}
  # 單趟成本（bps）超過此值時，短線訊號的分數打折
  cost_penalty_bps: 30
