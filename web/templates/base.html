<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}stockcore{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
<style>body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
<nav class="bg-slate-900 text-slate-100 px-4 py-3 flex gap-4 text-sm items-center">
  <a href="/" class="font-semibold">stockcore</a>
  <a href="/" class="hover:text-emerald-400">推薦排序</a>
  <a href="/check" class="hover:text-emerald-400">個股檢查</a>
  <a href="/universe" class="hover:text-emerald-400">股票池管理</a>
  <a href="/review" class="hover:text-emerald-400">復盤</a>
  <span class="ml-auto text-xs text-slate-400">{{ access_label() }}</span>
</nav>
<main class="flex-1 p-4 max-w-5xl w-full mx-auto">
{% block content %}{% endblock %}
</main>
<footer class="text-xs text-slate-500 text-center py-4 border-t mt-8">
  本工具僅為技術指標計算結果，不構成投資建議；評分權重尚未經回測驗證，使用者自負盈虧。
</footer>
<script>
// 複製指定元素的純文字內容。放在 base.html 而不是被 HTMX 換進來的片段裡，
// 避免每次輪詢都重新定義一次。
async function copyText(sourceId, btn) {
  const el = document.getElementById(sourceId);
  if (!el) return;
  const original = btn.textContent;
  const done = (ok) => {
    btn.textContent = ok ? "已複製" : "複製失敗，請展開下方純文字手動選取";
    setTimeout(() => { btn.textContent = original; }, 2500);
  };
  try {
    // navigator.clipboard 需要安全來源（HTTPS 或 localhost）
    await navigator.clipboard.writeText(el.textContent);
    done(true);
  } catch (e) {
    try {   // 退路：舊瀏覽器或非安全來源
      const ta = document.createElement("textarea");
      ta.value = el.textContent;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch (e2) { done(false); }
  }
}
</script>
</body>
</html>
